# Fork source validation is maintained here, not generated by kres. It never
# publishes images/releases or runs the ambient-cluster integration suite.
name: source
on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main, 'release-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, matched to pinned kres
      - name: setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: install-pinned-generators
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0
          go install k8s.io/code-generator/cmd/conversion-gen@v0.36.0
          curl -fsSL -o "$RUNNER_TEMP/kustomize_v4.1.0_linux_amd64.tar.gz" https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v4.1.0/kustomize_v4.1.0_linux_amd64.tar.gz
          printf '%s  %s\n' 77263c66afd04106348bebd019096933e26c0054d5b0ade8265f3426cf440ae6 "$RUNNER_TEMP/kustomize_v4.1.0_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/kustomize_v4.1.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP" kustomize
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: generated-source-freshness
        run: |
          make generate-local manifests-local
          git diff --exit-code -- api config
      - name: source-tests
        run: go test -short -count=1 ./api/... ./controllers ./internal/inplace ./internal/configowner ./internal/imagefactory ./pkg/...
      - name: rendered-release-contract
        env:
          RELEASE_TEST_KUSTOMIZE: kustomize
        run: go test -count=1 ./internal/release
      - name: controller-binary
        run: go build -trimpath -o "$RUNNER_TEMP/cabpt-manager" .
