# Sole tag publisher for this fork; ci.yaml is generated and nonpublishing.
# Publication requires the workflow's real tag, credentials and buildx digest.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
"on":
  push:
    tags:
      - v*
name: release
permissions:
  contents: write
  packages: write
env:
  REGISTRY: ghcr.io
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, matched to pinned kres
        with:
          fetch-depth: 0
      - name: release-identity
        id: identity
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/cluster-api-talos-controller:$GITHUB_REF_NAME"
          revision=$(git rev-parse HEAD)
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true;; esac
          printf 'username=%s\nimage=%s\nrevision=%s\nsource_url=%s\nprerelease=%s\n' \
            "$owner" "$image" "$revision" "https://github.com/$GITHUB_REPOSITORY" "$prerelease" >> "$GITHUB_OUTPUT"
      - name: setup-qemu
        uses: docker/setup-qemu-action@v4
      - name: setup-buildx
        uses: docker/setup-buildx-action@v4
      - name: generated-source-freshness
        run: |
          make generate manifests
          git diff --exit-code -- api config
      - name: login-ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: container
        run: |
          make container \
            PUSH=true \
            PLATFORM=linux/amd64,linux/arm64 \
            TAG="$GITHUB_REF_NAME" \
            USERNAME="${{ steps.identity.outputs.username }}" \
            CONTROLLER_IMAGE="${{ steps.identity.outputs.image }}" \
            SOURCE_URL="${{ steps.identity.outputs.source_url }}" \
            REVISION="${{ steps.identity.outputs.revision }}"
      - name: published-image
        id: published
        env:
          TAGGED_IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' _out/image-metadata.json)
          printf 'image=%s@%s\n' "${TAGGED_IMAGE%:*}" "$digest" >> "$GITHUB_OUTPUT"
      - name: release-manifests
        run: make release-manifests TAG="$GITHUB_REF_NAME" CONTROLLER_IMAGE="${{ steps.published.outputs.image }}"
      - name: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ steps.identity.outputs.revision }}
          files: _out/bootstrap-talos/${{ github.ref_name }}/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.identity.outputs.prerelease }}
