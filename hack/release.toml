# commit to be tagged for new release
commit = "HEAD"

project_name = "CAPI Bootstrap Provider Talos"
github_repo = "siderolabs/cluster-api-bootstrap-provider-talos"
match_deps = "^github.com/(siderolabs/[a-zA-Z0-9-]+)$"

# previous release
previous = "v0.8.1"

pre_release = false

[notes]

[notes.CAPI]
    title = "CAPI"
    description = """\
CABPT is now built against CAPI v1.14 (v1beta2 contract, unchanged), which adds
Kubernetes 1.37 for management and workload clusters. Kubernetes 1.37 workload
clusters need CAPI core v1.14.1 or later on the management cluster.
"""

[notes.Talos]
    title = "Talos 1.14"
    description = """\
CABPT is now compatible with Talos v1.14.0+. Configurations without a `talosVersion` are
generated for Talos 1.14 and use the multi-document Kubernetes, discovery and identity
configuration; pin `talosVersion` on configs that target older nodes.
"""

preface = """\
"""
