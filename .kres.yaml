# ci.yaml remains generated by pinned kres; this fork's public source validation
# is source.yaml and the sole tag publisher is release.yaml. Generated CI has no
# tag trigger, registry login, push or release job.
---
kind: auto.CI
spec:
  compileGHWorkflowsOnly: true
---
kind: common.Repository
spec:
  licenseChecks:
    - skipPaths:
        - .git/
        - testdata/
      includeSuffixes:
        - .go
      excludeSuffixes:
        - .pb.go
        - _string.go
        - _enumer.go
        - _string_linux.go
        - conversion.go
        - zz_generated.conversion.go
        - zz_generated.deepcopy.go
      header: |
        // This Source Code Form is subject to the terms of the Mozilla Public
        // License, v. 2.0. If a copy of the MPL was not distributed with this
        // file, You can obtain one at http://mozilla.org/MPL/2.0/.
---
kind: common.GHWorkflow
spec:
  workflowOptions:
    on:
      push:
        branches: [main, release-*]
      pull_request:
        branches: [main, release-*]
  jobs:
    - name: default
      runnerGroup: generic
      conditions:
        - on-pull-request
      steps:
        - name: source-tests
          nonMakeStep: true
          command: go test -short -count=1 ./api/... ./controllers ./internal/inplace ./internal/configowner ./internal/imagefactory ./pkg/...
          environment:
            GOMAXPROCS: "2"
            GOFLAGS: "-p=1"
